<html lang="bn">
<head>

<script type="text/javascript">
  setTimeout(function() {
    window.location.href = "https://t.me/xein_link_bot/myapp?startapp"; // আপনার লিঙ্ক দিন

    <script>
window.onload = function() {
    window.Adsgram.init({ blockId: "int-27349" }).show();

    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>🎬 প্রিমিয়াম ভিডিও হাব</title>

    <!-- Telegram WebApp & Adsgram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 560px;
            width: 100%;
            background: radial-gradient(
                circle at 10% 20%,
                #12101e,
                #03020a
            );
            min-height: 100vh;
            padding: 20px 16px 30px;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
        }

        /* Header */

        .premium-header {
            text-align: center;
            padding: 16px 0 24px;
            border-bottom: 2px solid rgba(255, 90, 130, 0.3);
            margin-bottom: 24px;
        }

        .premium-header h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(
                135deg,
                #FF95B3,
                #FFBC6E,
                #FFE6A3
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .premium-header p {
            color: #b0a0c0;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 600;
            background: rgba(255,70,110,0.15);
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }

        /* Video Grid */

        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Video Card */

        .video-card {
            background: rgba(22, 20, 38, 0.7);
            backdrop-filter: blur(14px);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 110, 150, 0.5);
            transition:
                transform 0.15s ease,
                box-shadow 0.2s ease;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .video-card:active {
            transform: scale(0.98);
            box-shadow:
                0 2px 10px rgba(255, 51, 102, 0.3);
        }

        /* Thumbnail */

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0d0b1a;
            overflow: hidden;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Play Overlay */

        .play-icon-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .play-icon-overlay:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        .play-icon-overlay svg {
            width: 70px;
            height: 70px;
            filter: drop-shadow(
                0 0 20px rgba(255, 51, 102, 0.8)
            );
            transition: transform 0.2s ease;
        }

        .video-card:hover .play-icon-overlay svg {
            transform: scale(1.05);
        }

        /* Footer */

        .video-card-footer {
            padding: 16px 18px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .video-title {
            font-weight: 700;
            font-size: 16px;
            color: #f0e0f0;
            letter-spacing: 0.3px;
        }

        /* Play Button */

        .play-btn {
            background: linear-gradient(
                105deg,
                #ff2b6d,
                #ff8f4d
            );
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 14px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 4px 15px rgba(255, 51, 102, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow:
                0 2px 8px rgba(255, 51, 102, 0.3);
        }

        .play-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Loading Overlay */

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #03010cee;
            backdrop-filter: blur(25px);
            z-index: 9999;

            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .film-spinner {
            width: 70px;
            height: 70px;

            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ff5982" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 4v16"/><path d="M16 4v16"/><path d="M2 8h4"/><path d="M2 12h4"/><path d="M2 16h4"/><path d="M18 8h4"/><path d="M18 12h4"/><path d="M18 16h4"/></svg>') no-repeat center;

            background-size: contain;

            animation:
                spinReel 1s infinite
                cubic-bezier(0.5, 0, 0.5, 1);
        }

        @keyframes spinReel {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #ff91b5;
            margin-top: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.6);
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 14px;
        }

        /* Ad Status */

        .ad-status {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: #9d91a8;
            display: none;
        }

        .ad-status.show {
            display: block;
        }

        /* Scrollbar */

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #1a162e;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6085;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- Loading -->
    <div class="loading-overlay" id="loadingOverlay">

        <div class="film-spinner"></div>

        <div class="loading-text">
            ✨ অ্যাড লোড হচ্ছে...
        </div>

    </div>


    <!-- Main Content -->
    <div id="mainContent">

        <div class="premium-header">

            <h1>🎬 প্রিমিয়াম ভিডিও হাব</h1>

            <p>
                🔥 এক্সক্লুসিভ কন্টেন্ট
            </p>

        </div>


        <div class="video-grid" id="videoGrid"></div>


        <div class="ad-status" id="adStatus">
            🔥 বিজ্ঞাপনটি সম্পন্ন হয়েছে। আবার ক্লিক করুন।
        </div>

    </div>

</div>


<script>

    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const ADSGRAM_BLOCK_ID = "int-27349";


    const REDIRECT_LINKS = [

        "https://omg10.com/4/9809282",

        "https://omg10.com/4/9809284",

        "https://omg10.com/4/11037812"

    ];


    /* Redirect delay নেই।
       কারণ Ad শেষ হওয়ার পরে দ্বিতীয় click-এই redirect হবে।
    */


    /* =====================================================
       IMAGE LIST
    ===================================================== */

    const imageUrls = [

        "https://i.ibb.co.com/8wncFkz/1779251855090.png",

        "https://i.ibb.co.com/jk8f32gP/1779124026104.jpg",

        "https://i.ibb.co.com/tMmg7ScJ/1779251871644.png",

        "https://i.ibb.co.com/5xwYHGZf/IMG-20260822-221553-168.jpg",

        "https://i.ibb.co.com/hRT6G2g7/IMG-20260822-221551-005.jpg",

        "https://i.ibb.co.com/tMZ5xyL8/IMG-20260822-221548-616.jpg",

        "https://i.ibb.co.com/MxB3KRtW/IMG-20260822-221547-774.jpg",

        "https://i.ibb.co.com/hRDDWsfm/IMG-20260822-221546-925.jpg",

        "https://i.ibb.co.com/S43YwKzs/IMG-20260822-221544-925.jpg",

        "https://i.ibb.co.com/7dVjKHsq/IMG-20260822-221529-119.jpg",

        "https://i.ibb.co.com/21zXGV87/IMG-20260822-221527-824.jpg",

        "https://i.ibb.co.com/j96DYscF/IMG-20260822-221526-366.jpg",

        "https://i.ibb.co.com/1Jm81ybR/IMG-20260822-221524-729.jpg",

        "https://i.ibb.co.com/jvq57d9p/IMG-20260822-221455-554.jpg",

        "https://i.ibb.co.com/cX7BVL22/IMG-20260822-221445-158.jpg",

        "https://i.ibb.co.com/Y739DsXm/IMG-20260822-221444-320.jpg",

        "https://i.ibb.co.com/k2qJVjnV/IMG-20260822-221443-140.jpg",

        "https://i.ibb.co.com/fz1HNPF0/IMG-20260822-221442-522.jpg",

        "https://i.ibb.co.com/rKRhg88Z/IMG-20260822-221440-971.jpg",

        "https://i.ibb.co.com/VWJbRQ6M/IMG-20260822-221440-190.jpg",

        "https://i.ibb.co.com/3mM3ntKh/IMG-20260822-221435-521.jpg",

        "https://i.ibb.co.com/DPmCZLWH/IMG-20260822-221434-264.jpg",

        "https://i.ibb.co.com/zVWFsgbt/IMG-20260822-221433-098.jpg",

        "https://i.ibb.co.com/rKZfQYdV/IMG-20260822-221431-813.jpg",

        "https://i.ibb.co.com/YF32czR6/IMG-20260822-221430-955.jpg",

        "https://i.ibb.co.com/Gf78HQSn/IMG-20260822-221428-982.jpg",

        "https://i.ibb.co.com/Dfv9sF1p/IMG-20260822-221427-181.jpg"

    ];


    /* =====================================================
       VARIABLES
    ===================================================== */

    const uniqueImages = [
        ...new Set(imageUrls)
    ];


    const loadingOverlay =
        document.getElementById("loadingOverlay");


    const videoGrid =
        document.getElementById("videoGrid");


    const adStatus =
        document.getElementById("adStatus");


    let linkIndex = 0;


    let isProcessing = false;


    /*
       false = প্রথম click এখনো হয়নি
       true  = Ad সম্পন্ন হয়েছে,
               এখন দ্বিতীয় click-এ redirect হবে
    */

    let adCompleted = false;



    /* =====================================================
       ADSGRAM FUNCTION
    ===================================================== */

    function showAdsgramAd() {

        return new Promise((resolve) => {

            /*
               Adsgram SDK আছে কিনা check
            */

            if (
                typeof window.Adsgram === "undefined" ||
                typeof window.Adsgram.init !== "function"
            ) {

                console.error(
                    "❌ Adsgram SDK পাওয়া যায়নি!"
                );

                resolve(false);

                return;
            }


            try {

                /*
                   Block ID দিয়ে controller তৈরি
                */

                const AdController =
                    window.Adsgram.init({

                        blockId:
                            ADSGRAM_BLOCK_ID

                    });


                /*
                   Ad Show
                */

                AdController.show()

                    .then(() => {

                        console.log(
                            "✅ Adsgram Ad সম্পূর্ণ হয়েছে"
                        );


                        /*
                           Ad সম্পূর্ণ হয়েছে
                        */

                        adCompleted = true;


                        /*
                           Status message
                        */

                        adStatus.classList.add("show");


                        resolve(true);

                    })


                    .catch((error) => {

                        console.error(
                            "❌ Adsgram Ad Error:",
                            error
                        );


                        /*
                           Ad না দেখালে
                           redirect করা হবে না
                        */

                        resolve(false);

                    });


            } catch (error) {

                console.error(
                    "❌ Adsgram Init Error:",
                    error
                );


                resolve(false);

            }

        });

    }



    /* =====================================================
       VIDEO CLICK HANDLER
    ===================================================== */

    async function handleVideoClick(event) {

        /*
           Card এবং button click একসাথে trigger
           হওয়া বন্ধ করবে
        */

        if (event) {

            event.preventDefault();

            event.stopPropagation();

        }


        /*
           একই সময়ে একাধিক click আটকানো
        */

        if (isProcessing) {

            return;

        }


        isProcessing = true;



        /* =================================================
           FIRST CLICK
           Ads Show
        ================================================= */

        if (!adCompleted) {

            console.log(
                "👉 First click: Adsgram Ad দেখানো হচ্ছে..."
            );


            loadingOverlay.classList.add("show");


            const adResult =
                await showAdsgramAd();


            loadingOverlay.classList.remove("show");


            isProcessing = false;


            /*
               Ad সফলভাবে সম্পূর্ণ না হলে
               এখানেই থামবে
            */

            if (!adResult) {

                console.log(
                    "⚠️ Ad সম্পূর্ণ হয়নি। আবার চেষ্টা করুন।"
                );

                return;

            }


            /*
               Ad সম্পূর্ণ হয়েছে।
               এখন আবার click করতে হবে।
            */

            return;

        }



        /* =================================================
           SECOND CLICK
           REDIRECT
        ================================================= */

        console.log(
            "👉 Second click: Redirect হচ্ছে..."
        );


        const currentLink =
            REDIRECT_LINKS[
                linkIndex %
                REDIRECT_LINKS.length
            ];


        linkIndex++;


        console.log(
            "➡️ Redirect URL:",
            currentLink
        );


        /*
           Redirect
        */

        window.location.href =
            currentLink;


    }



    /* =====================================================
       BUILD VIDEO GALLERY
    ===================================================== */

    function buildGallery() {

        if (!videoGrid) {

            return;

        }


        videoGrid.innerHTML = "";


        uniqueImages.forEach(
            (imgUrl, index) => {


                /* ===============================
                   CARD
                =============================== */

                const card =
                    document.createElement("div");


                card.className =
                    "video-card";



                /* ===============================
                   THUMBNAIL
                =============================== */

                const thumbWrapper =
                    document.createElement("div");


                thumbWrapper.className =
                    "thumbnail-wrapper";



                /* ===============================
                   IMAGE
                =============================== */

                const img =
                    document.createElement("img");


                img.src =
                    imgUrl;


                img.alt =
                    `Video ${index + 1}`;


                img.loading =
                    "lazy";


                /*
                   Image load error
                */

                img.onerror =
                    function() {

                        this.src =
                            "https://placehold.co/600x400/1e1a2e/ff88aa?text=Image+Not+Found";

                    };



                /* ===============================
                   PLAY OVERLAY
                =============================== */

                const playOverlay =
                    document.createElement("div");


                playOverlay.className =
                    "play-icon-overlay";


                playOverlay.innerHTML = `

                    <svg
                        viewBox="0 0 24 24"
                        fill="white"
                        stroke="white"
                        stroke-width="1"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                            fill="rgba(0,0,0,0.5)"
                            stroke="white"
                            stroke-width="1.5"
                        />

                        <polygon
                            points="10,8 16,12 10,16"
                            fill="white"
                        />

                    </svg>

                `;



                thumbWrapper.appendChild(img);

                thumbWrapper.appendChild(
                    playOverlay
                );


                card.appendChild(
                    thumbWrapper
                );



                /* ===============================
                   FOOTER
                =============================== */

                const footer =
                    document.createElement("div");


                footer.className =
                    "video-card-footer";



                /* ===============================
                   TITLE
                =============================== */

                const title =
                    document.createElement("span");


                title.className =
                    "video-title";


                title.textContent =
                    `🎬 ভিডিও ${index + 1}`;



                /* ===============================
                   PLAY BUTTON
                =============================== */

                const playBtn =
                    document.createElement("button");


                playBtn.className =
                    "play-btn";


                playBtn.type =
                    "button";


                playBtn.innerHTML = `

                    <svg viewBox="0 0 24 24">

                        <polygon
                            points="5,3 19,12 5,21"
                            fill="white"
                        />

                    </svg>

                    প্লে ভিডিও

                `;



                footer.appendChild(title);

                footer.appendChild(playBtn);


                card.appendChild(footer);



                /* ===============================
                   CLICK EVENT
                =============================== */

                /*
                   Card-এর যেকোনো জায়গায় click
                   করলে Ads/Redirect হবে
                */

                card.addEventListener(
                    "click",
                    handleVideoClick
                );


                /*
                   Button click আলাদাভাবে
                   handle করতে হবে না।

                   কারণ card event-ই button click
                   ধরে ফেলবে।

                   তবে button-এর event propagation
                   বন্ধ করার জন্য আলাদা listener
                   ব্যবহার করা হচ্ছে।
                */

                playBtn.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();

                        handleVideoClick(event);

                    }
                );


                /*
                   Gallery-তে card যোগ
                */

                videoGrid.appendChild(card);

            }
        );

    }



    /* =====================================================
       PAGE LOAD
    ===================================================== */

    window.addEventListener(
        "load",
        function() {

            /*
               শুধু gallery তৈরি হবে।

               এখানে কোনো Adsgram Ad
               automaticভাবে চালানো হবে না।
            */

            buildGallery();


            console.log(
                "✅ Premium Video Hub loaded"
            );

            console.log(
                "ℹ️ First click = Adsgram"
            );

            console.log(
                "ℹ️ Second click = Redirect"
            );

        }
    );



    /* =====================================================
       TELEGRAM WEB APP
    ===================================================== */

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {

        window.Telegram.WebApp.ready();

        window.Telegram.WebApp.expand();

    }

</script>

</body>
</html>
